name: CrimsonOS Kernel CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CROSS_COMPILE: aarch64-linux-gnu-
  ARCH: arm64

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check copyright headers
        run: |
          MISSING=$(find kernel/ include/ drivers/ -name "*.c" -o -name "*.h" -o -name "*.S" | xargs grep -L "SynChanCyberSecurity LLC" || true)
          if [ -n "$MISSING" ]; then echo "[FAIL] Missing headers:"; echo "$MISSING"; exit 1; fi
          echo "[PASS] All headers OK"
      - name: Syntax check
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          for f in $(find kernel/ drivers/ -name "*.c"); do
            aarch64-linux-gnu-gcc -fsyntax-only -Iinclude -Iinclude/crimson -D__KERNEL__ -DCONFIG_ARM64 -march=armv8-a $f || exit 1
          done

  build-phone:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - run: cp configs/phone_defconfig .config && make CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-image-phone
          path: Image
          retention-days: 7

  build-dsot:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - run: cp configs/dsot_defconfig .config && make CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-image-dsot
          path: Image
          retention-days: 7

  build-compute:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - run: cp configs/compute_defconfig .config && make CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-image-compute
          path: Image
          retention-days: 7
