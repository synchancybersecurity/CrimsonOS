<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Crimson OS</title>
<style>
:root{--bg:#000;--s1:#0a0a0a;--s2:#111;--s3:#1a1a1a;--label:#8E8E93;--text:#fff;--text2:rgba(235,235,245,.6);--text3:rgba(235,235,245,.3);--sep:#1a1a1a;--tint:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--yellow:#FFD60A;--purple:#BF5AF2;--pink:#FF375F;--teal:#64D2FF;--indigo:#5E5CE6;--crimson:#DC143C;--dW:390px;--dH:844px;--sb:54px;--nb:34px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
body{background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
#device{width:var(--dW);height:var(--dH);background:#000;border-radius:54px;position:relative;overflow:hidden;box-shadow:0 0 0 3px #111,0 0 60px rgba(220,20,60,.12),0 40px 120px rgba(0,0,0,.8)}
#screen{width:100%;height:100%;position:relative;overflow:hidden;background:#000}
#di{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:126px;height:37px;background:#000;border-radius:20px;z-index:1000}
#hi{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:#fff;border-radius:3px;z-index:1000;opacity:.9}
.v{position:absolute;inset:0;overflow:hidden;transition:transform .5s cubic-bezier(.32,.72,0,1),opacity .4s ease}
.v.h{transform:translateY(20px);opacity:0;pointer-events:none}
.v.si{animation:si .4s cubic-bezier(.32,.72,0,1)}
@keyframes si{from{transform:translateX(100%);opacity:.8}to{transform:none;opacity:1}}
.gl{background:rgba(10,10,10,.65);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.06)}
/* Boot */
#boot{background:#000;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#bl{width:160px;height:160px;margin-bottom:0;display:flex;align-items:center;justify-content:center;animation:bli 1.2s cubic-bezier(.22,1,.36,1) forwards;opacity:0;position:relative}
#bl.glow::after{content:"";position:absolute;inset:-40px;background:radial-gradient(circle,rgba(100,0,0,.25) 0%,rgba(100,0,0,.08) 40%,transparent 70%);border-radius:50%;pointer-events:none;z-index:-1}
#blc{width:100%;height:100%;object-fit:contain;mix-blend-mode:lighten;filter:invert(1) sepia(1) saturate(7) brightness(.55) hue-rotate(298deg);transition:filter 1.5s ease}
#bl.glow #blc{filter:invert(1) sepia(1) saturate(7) brightness(.6) hue-rotate(298deg);mix-blend-mode:lighten}
#bb{display:flex;flex-direction:column;align-items:center;margin-top:20px}
#bt{font-size:20px;font-weight:700;color:#DC143C;letter-spacing:8px;text-transform:uppercase;margin-bottom:4px;opacity:0;animation:btf .8s .9s ease forwards}
#bs{font-size:10px;color:rgba(220,20,60,.45);letter-spacing:3px;opacity:0;animation:btf .6s 1.3s ease forwards}
@keyframes bli{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes btf{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
/* App Icons */
.ai{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;overflow:hidden;flex-shrink:0}
.ai::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.25) 0%,transparent 50%,rgba(0,0,0,.1) 100%);pointer-events:none}
.ai-s{width:40px;height:40px;border-radius:10px;font-size:20px}
.an{font-size:11px;color:#fff;text-align:center;margin-top:5px;text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
/* Toggle */
.tg{width:51px;height:31px;border-radius:16px;background:var(--s3);position:relative;cursor:pointer;transition:background .25s;flex-shrink:0}
.tg.on{background:var(--green)}.tg::after{content:'';position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.32,.72,0,1)}.tg.on::after{transform:translateX(20px)}
/* List */
.lg{margin:0 16px 16px;border-radius:12px;overflow:hidden}
.lg-t{font-size:13px;color:var(--label);text-transform:uppercase;letter-spacing:.5px;margin:0 16px 8px;font-weight:600}
.lc{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;background:var(--s1);min-height:44px;cursor:pointer;position:relative}
.lc+.lc::before{content:'';position:absolute;top:0;left:52px;right:0;height:.5px;background:var(--sep)}
/* Springboard */
#sb{padding:var(--sb) 16px 0;height:100%;display:flex;flex-direction:column}
.sg-wrap{flex:1;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;display:flex;-webkit-overflow-scrolling:touch;min-height:0}
.sg-page{min-width:100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 0;place-items:center;align-content:start;padding:8px 4px 0}
.app-slot{display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;position:relative}
.app-x{display:none;position:absolute;top:-4px;left:-4px;width:20px;height:20px;border-radius:50%;background:var(--s3);color:var(--label);font-size:11px;z-index:2;align-items:center;justify-content:center}
.editing .app-slot{animation:jiggle .3s infinite alternate}
.editing .app-x{display:flex}
@keyframes jiggle{0%{transform:rotate(-1.5deg)}100%{transform:rotate(1.5deg)}}
#dock{background:rgba(0,0,0,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:30px;display:flex;justify-content:space-around;align-items:center;padding:10px 8px;margin:4px 0 10px}
.wm{width:100%;border-radius:22px;padding:14px;margin-bottom:10px}
/* App nav */
.an-bar{display:flex;align-items:center;padding:0 8px;height:var(--sb);position:relative;background:#000}
.an-title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;color:var(--text)}
.an-btn{font-size:17px;color:var(--tint);cursor:pointer;padding:8px;z-index:1}
.a-scroll{height:calc(100% - var(--sb));overflow-y:auto;overflow-x:hidden;background:#000}
/* Terminal */
.tm{padding:8px 12px;font-family:'SF Mono',Menlo,monospace;font-size:12px;line-height:1.7;color:#c0c0c0;overflow-y:auto;height:calc(100% - var(--sb) - 44px);background:#000}
.tm-i{display:flex;align-items:center;gap:4px;padding:0 12px;height:44px;background:var(--s1);border-top:1px solid var(--sep)}
.tm-in{flex:1;background:none;border:none;color:#fff;font-family:inherit;font-size:12px;outline:none;caret-color:var(--crimson)}
/* Phone */
.ph-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 24px;max-width:320px;margin:0 auto}
.ph-key{height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text);cursor:pointer;transition:background .1s}
.ph-key:active{background:rgba(255,255,255,.12)}
.ph-key .d{font-size:30px;font-weight:300;line-height:1}
.ph-key .sub{font-size:8px;color:var(--label);letter-spacing:1.5px;margin-top:1px}
/* Messages */
.cb{max-width:75%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.35;word-wrap:break-word}
.cb.s{align-self:flex-end;background:var(--crimson);color:#fff;border-bottom-right-radius:4px}
.cb.r{align-self:flex-start;background:var(--s2);color:var(--text);border-bottom-left-radius:4px}
.ch-in{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--sep);background:#000}
.ch-inp{flex:1;background:var(--s2);border:none;border-radius:18px;padding:8px 14px;color:var(--text);font-size:15px;outline:none}
/* BloodMoon Browser */
.bm-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--s1);border-bottom:1px solid var(--sep)}
.bm-url{flex:1;background:var(--s2);border:none;border-radius:10px;padding:8px 12px;color:var(--text);font-size:14px;outline:none}
.bm-tabs{display:flex;gap:4px;padding:4px 10px;background:var(--s1);overflow-x:auto;border-bottom:1px solid var(--sep)}
.bm-tab{padding:4px 12px;border-radius:8px;background:var(--s2);font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;border:1px solid transparent}
.bm-tab.on{border-color:var(--crimson);color:var(--text)}
.bm-frame{flex:1;border:none;width:100%;background:#000}
/* Calculator */
.ca-d{text-align:right;padding:16px 20px;font-size:56px;font-weight:300;color:var(--text);min-height:90px;display:flex;align-items:flex-end;justify-content:flex-end;overflow:hidden}
.ca-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 14px 16px}
.ca-b{height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:500;cursor:pointer;transition:filter .1s}
.ca-b:active{filter:brightness(1.3)}.ca-gr{background:var(--s2);color:var(--text)}.ca-op{background:var(--orange);color:#fff}
.ca-z{grid-column:span 2;border-radius:33px;justify-content:flex-start;padding-left:24px}
/* Camera */
.cam-vf{flex:1;background:linear-gradient(135deg,#0a0a0a,#0d1018,#0a0a0a);position:relative;display:flex;align-items:center;justify-content:center}
.cam-sh{width:64px;height:64px;border-radius:50%;border:4px solid #fff;margin:10px auto;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cam-sh-i{width:52px;height:52px;background:#fff;border-radius:50%;transition:all .15s}
.cam-sh:active .cam-sh-i{transform:scale(.88)}
/* Store */
.st-feat{height:160px;border-radius:12px;margin:0 16px 14px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.st-row{display:flex;gap:10px;padding:0 16px;overflow-x:auto;margin-bottom:14px}
.st-card{min-width:96px;display:flex;flex-direction:column;align-items:center;gap:4px}
/* Pressable */
.pr{transition:transform .1s,opacity .1s;cursor:pointer}.pr:active{transform:scale(.96);opacity:.8}
/* Slider */
.sl{-webkit-appearance:none;appearance:none;width:100%;height:28px;border-radius:14px;background:var(--s3);outline:none;cursor:pointer}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
/* Notification badge */
.nb{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Mobile: fill entire screen, no device frame */
@media(max-width:500px){
  body{background:#000!important}
  #device{width:100vw!important;height:100vh!important;height:100dvh!important;border-radius:0!important;box-shadow:none!important}
  #screen{border-radius:0!important}
  #di{display:none!important}
  #hi{bottom:calc(env(safe-area-inset-bottom,8px) + 2px)!important}
  #sb{padding-top:env(safe-area-inset-top,48px)!important}
  .an-bar{padding-top:env(safe-area-inset-top,0px)!important;height:calc(var(--sb) + env(safe-area-inset-top,0px))!important}
  #dock{margin-bottom:calc(env(safe-area-inset-bottom,8px) + 6px)!important}
}

/* Edit mode */
@keyframes jiggle{0%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}100%{transform:rotate(-1.5deg)}}
.editing .app-slot{animation:jiggle .25s infinite}
.editing .app-x{display:flex!important}
.app-x{display:none;position:absolute;top:-4px;left:-4px;width:20px;height:20px;border-radius:50%;background:rgba(60,60,60,.9);color:#fff;font-size:12px;align-items:center;justify-content:center;z-index:10;cursor:pointer;border:1px solid rgba(255,255,255,.2)}
.app-slot{position:relative}
#edit-bar{display:none;padding:8px 16px;background:var(--s1);border-bottom:1px solid var(--sep)}
.editing #edit-bar{display:flex;justify-content:space-between;align-items:center}
</style>
</head>

  rCalc(){
    this.calc='';this.calcOp='';this.calcPrev='';this.calcReset=false;

    [['AC','ca-gr','cC'],['±','ca-gr','cN'],['%','ca-gr','cP'],['÷','ca-op','cO÷'],
     ['7','ca-gr','cD7'],['8','ca-gr','cD8'],['9','ca-gr','cD9'],['×','ca-op','cO×'],
     ['4','ca-gr','cD4'],['5','ca-gr','cD5'],['6','ca-gr','cD6'],['−','ca-op','cO-'],
     ['1','ca-gr','cD1'],['2','ca-gr','cD2'],['3','ca-gr','cD3'],['+','ca-op','cO+'],
     ['0','ca-gr ca-z','cD0'],['.','ca-gr','cD.'],['=','ca-op','cE']].forEach(b=>{
      h+=`<div class="ca-b ${b[1]}" onclick="OS.cK('${b[2]}')">${b[0]}</div>`});
    h+=`</div></div>`;document.getElementById('av-body').innerHTML=h;

  cK(k){
    const d=document.getElementById('ca-d');
    if(k==='cC'){this.calc='';this.calcOp='';this.calcPrev='';d.textContent='0';return}
    if(k==='cN'){this.calc=String(-parseFloat(this.calc||'0'));d.textContent=this.calc;return}
    if(k==='cP'){this.calc=String(parseFloat(this.calc||'0')/100);d.textContent=this.calc;return}
    if(k.startsWith('cO')){this.calcPrev=this.calc||'0';this.calcOp=k[2];this.calcReset=true;return}
    if(k==='cE'){
      const a=parseFloat(this.calcPrev||'0'),b=parseFloat(this.calc||'0');
      let r=0;if(this.calcOp==='+')r=a+b;if(this.calcOp==='-')r=a-b;if(this.calcOp==='×')r=a*b;if(this.calcOp==='÷')r=b!==0?a/b:0;
      this.calc=String(Math.round(r*1e10)/1e10);this.calcOp='';this.calcPrev='';d.textContent=this.calc;return}
    if(k.startsWith('cD')){
      if(this.calcReset){this.calc='';this.calcReset=false}
      this.calc+=k[2];d.textContent=this.calc}
  },

    let h=`<div style="padding:12px 0"><div style="padding:0 16px 12px;font-size:22px;font-weight:700;color:var(--crimson)">&#9889; Arsenal</div>`;
    [{cat:'Network',tools:['Nmap','Wireshark','Netcat','Tcpdump']},{cat:'Wireless',tools:['Aircrack-ng','Kismet','Reaver','Wifite']},{cat:'Exploitation',tools:['Metasploit','SQLMap','Nikto','Hydra']},{cat:'Crypto',tools:['Hashcat','John','OpenSSL']},{cat:'Forensics',tools:['Autopsy','Foremost','Sleuthkit']}].forEach(g=>{
      h+=`<div class="lg-t">${g.cat}</div><div class="lg">`;
      g.tools.forEach(t=>{h+=`<div class="lc pr" onclick="OS.nwRun('${t}')"><div style="font-size:16px;color:var(--text)">${t}</div><div style="padding:4px 12px;border-radius:12px;background:var(--crimson);color:#fff;font-size:12px;font-weight:600">RUN</div></div>`});
      h+=`</div>`});
    h+=`</div>`;document.getElementById('av-body').innerHTML=h;
  },
  nwRun(tool){this.notify('NetWiz',tool,'Scan initiated on local network...','info')},

  // ═══ SECURITY ═══
  rSecurity(){
    document.getElementById('av-body').innerHTML=`<div style="padding:16px"><div style="width:120px;height:120px;border-radius:50%;border:6px solid var(--s3);border-top-color:var(--green);margin:0 auto 16px;display:flex;align-items:center;justify-content:center"><div style="font-size:36px;font-weight:700;color:var(--green)">98</div></div><div style="text-align:center;font-size:14px;color:var(--green);margin-bottom:16px">Security Score: Excellent</div><div style="background:var(--s1);border-radius:14px;padding:16px;margin-bottom:12px"><div style="font-size:13px;color:var(--label);margin-bottom:12px">ACTIVE PROTECTIONS</div>${['MAC Enforcement|ON','ASLR Randomization|ON','CFI Protection|ON','NX Bit|ON','Stack Canaries|ON','Secure Boot|VERIFIED'].map(p=>{const[n,v]=p.split('|');return`<div style="display:flex;justify-content:space-between;padding:6px 0"><div style="color:#fff;font-size:15px">${n}</div><div style="color:var(--green);font-size:13px;font-weight:600">${v}</div></div>`}).join('')}</div><div style="background:var(--s1);border-radius:14px;padding:16px"><div style="font-size:13px;color:var(--label);margin-bottom:8px">AUDIT LOG</div><div style="font-family:monospace;font-size:11px;color:var(--text2);line-height:1.8">[audit] MAC policy loaded: app→system deny<br>[audit] Boot chain verified GREEN<br>[audit] ASLR stack randomized 18-bit<br>[audit] CFI: 24 functions registered<br>[audit] Sandbox #0 created: isolated<br>[audit] Package signature verified OK</div></div></div>`;
  },

  // ═══ WALLET ═══
  rWallet(){document.getElementById('av-body').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px"><div style="font-size:64px">&#128179;</div><div style="font-size:20px;font-weight:600;color:#fff">Crimson Wallet</div><div style="font-size:13px;color:var(--label);text-align:center;padding:0 40px">Secure cryptocurrency and payment management with hardware-backed key storage.</div></div>`},

  // ═══ NOTIFICATIONS ═══
  notify(app,title,body,level){
    this.nfs.unshift({id:this.nid++,app,title,body,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
    if(this.nfs.length>20)this.nfs.pop();/* notifications stay in tray only */
  },
  renderLockNotifs(){
    const el=document.getElementById('lk-nf');if(!el||!this.nfs.length)return;
    const n=this.nfs[0];
    el.innerHTML=`<div style="background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border-radius:14px;padding:12px 16px"><div style="font-size:12px;color:var(--label);margin-bottom:2px">${n.app} · now</div><div style="font-size:15px;color:#fff;font-weight:600">${n.title}</div><div style="font-size:13px;color:var(--text2);margin-top:2px">${n.body}</div></div>`;
  },
  renderNotifs(){
    const el=document.getElementById('nf-list'),empty=document.getElementById('nf-empty');
    if(!this.nfs.length){if(el)el.innerHTML='';if(empty)empty.style.display='block';return}
    if(empty)empty.style.display='none';
    if(el)el.innerHTML=this.nfs.map(n=>`<div style="background:var(--s1);border-radius:14px;padding:12px 16px;margin-bottom:10px"><div style="display:flex;gap:8px;margin-bottom:4px"><div style="font-size:11px;color:var(--label);font-weight:600">${n.app.toUpperCase()}</div><div style="font-size:11px;color:var(--text3)">${n.time}</div></div><div style="font-size:15px;color:#fff;font-weight:600">${n.title}</div><div style="font-size:13px;color:var(--text2);margin-top:2px">${n.body}</div></div>`).join('');
  },

  // ═══ GLOBAL EVENTS ═══
  bind(){
    let sy=0;const scr=document.getElementById('screen');
    scr.addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
    scr.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-sy;
      if(this.vw==='lock'&&dy<-80)this.unlock();
      if(this.vw==='home'&&dy<-200)this.sv('notif');
      if(this.vw==='notif'&&dy>60)this.sv('home');
    },{passive:true});
    let lpt=0;const sg=document.getElementById('sg-wrap');
    if(sg){sg.addEventListener('touchstart',()=>{lpt=setTimeout(()=>{if(OS.vw==='home'&&!OS.editMode)OS.toggleEdit()},600)},{passive:true});
    sg.addEventListener('touchend',()=>clearTimeout(lpt),{passive:true});
    sg.addEventListener('touchmove',()=>clearTimeout(lpt),{passive:true})}
    document.getElementById('hi').addEventListener('click',()=>{
      if(this.vw==='home')this.sv('cc');else if(this.vw==='cc')this.sv('home');else this.sv('home')});
  },
  toggleW(){this.wifiOn=!this.wifiOn;const e=document.getElementById('cc-wifi');if(e)e.style.background=this.wifiOn?'var(--tint)':'var(--s3)'},
};

window.addEventListener('DOMContentLoaded',()=>OS.init());
</script>
</body>
</html>
